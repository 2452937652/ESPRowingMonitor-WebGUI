<mat-card class="justify-center" [class.with-trend]="showTrend()" [class.numbers-only]="!showTrend()">
    <div class="flex-col justify-center metric">
        <div class="metric-heading">
            @if (icon() === undefined) {
                <span class="title">{{ title() }}</span>
            }
            @if (icon()) {
                <mat-icon
                    matTooltipPosition="above"
                    matTooltipShowDelay="1000"
                    [matTooltip]="title() ?? ''"
                    >{{ icon() }}</mat-icon
                >
                <span class="caption">{{ title() }}</span>
            }
        </div>
        <div class="value">
            <span> {{ value() }} </span> <span class="unit"> {{ unit() }} </span>
        </div>
        @if (showTrend()) {
            <app-metric-trend-chart
                [samples]="trendSamples()"
                [intensitySamples]="trendIntensitySamples()"
                [chartStyle]="trendStyle()"
                [label]="title() ?? ''"
            ></app-metric-trend-chart>
        }
    </div>
    <ng-content></ng-content>
</mat-card>
